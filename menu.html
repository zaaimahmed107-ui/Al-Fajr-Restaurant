<h1 class="menu-title">

Our <span class="gold">Menu</span> 🍽️

</h1>

<div class="row" id="menuContainer">

</div>

</div>
<script>


// ==========================
// LOAD FOOD FROM DATABASE
// ==========================


async function loadMenu(){


try{


let response = await fetch(
"http://localhost:5000/foods"
);



let foods = await response.json();



let container = document.getElementById("menuContainer");


container.innerHTML="";



foods.forEach(food=>{



container.innerHTML += `



<div class="col-lg-4 col-md-6 mb-4">


<div class="food-card">



<img src="${food.image}" alt="${food.name}">



<div class="food-body">


<span class="category">

${food.category}

</span>



<h3>

${food.name}

</h3>



<div class="price">

Rs.${food.price}

</div>



<button class="btn btn-gold mt-3"

onclick="addToCart(

'${food._id}',

'${food.name}',

${food.price},

'${food.image}'

)">


Add To Cart 🛒


</button>



</div>


</div>


</div>



`;



});


}

catch(error){


console.log(error);


}



}





// ==========================
// ADD TO CART
// ==========================


let cart = JSON.parse(localStorage.getItem("cart")) || [];




function addToCart(id,name,price,image){



let item = cart.find(product=>product.id===id);



if(item){


item.quantity++;


}

else{


cart.push({

id:id,

name:name,

price:price,

image:image,

quantity:1

});


}



localStorage.setItem(

"cart",

JSON.stringify(cart)

);



alert("Food Added To Cart 🛒");



}




loadMenu();



</script>
