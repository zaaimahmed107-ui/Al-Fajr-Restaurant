<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Add Food | Al Fajr Restaurant</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">


<style>

body{
    background:#f4f4f4;
}

.card{
    border:none;
    border-radius:15px;
}

.card-header{
    border-radius:15px 15px 0 0 !important;
}

</style>

</head>


<body>


<div class="container mt-5 mb-5">


<div class="row justify-content-center">


<div class="col-lg-8">


<div class="card shadow-lg">


<div class="card-header bg-dark text-white">

<h2 id="pageTitle">
<i class="bi bi-plus-circle"></i>
Add Food Item
</h2>

</div>



<div class="card-body">


<div id="message" class="alert alert-success d-none">
Food Added Successfully ✅
</div>


<div id="error" class="alert alert-danger d-none">
Something went wrong ❌
</div>



<form id="foodForm">



<div class="mb-3">

<label class="form-label">
Food Name
</label>

<input 
type="text"
class="form-control"
id="foodName"
placeholder="Enter Food Name"
required>

</div>





<div class="mb-3">

<label class="form-label">
Price (Rs.)
</label>

<input 
type="number"
class="form-control"
id="price"
placeholder="Enter Price"
required>

</div>





<div class="mb-3">

<label class="form-label">
Category
</label>


<select 
class="form-select"
id="category"
required>


<option value="">
Select Category
</option>


<option>Burger</option>

<option>BBQ</option>

<option>Biryani</option>

<option>Roll</option>

<option>Pizza</option>

<option>Drinks</option>


</select>


</div>





<div class="mb-3">

<label class="form-label">
Description
</label>


<textarea
class="form-control"
id="description"
rows="4"
placeholder="Enter Food Description">
</textarea>


</div>





<div class="mb-3">

<label class="form-label">
Food Image URL
</label>


<input
type="text"
class="form-control"
id="image"
placeholder="Paste Image URL"
required>


</div>





<div class="d-flex gap-2">


<button 
type="submit"
class="btn btn-success">


<i class="bi bi-check-circle"></i>

<span id="saveText">Save Food</span>


</button>




<button 
type="reset"
class="btn btn-warning">


<i class="bi bi-arrow-clockwise"></i>

Reset


</button>





<a 
href="admin.html"
class="btn btn-secondary">


<i class="bi bi-arrow-left"></i>

Dashboard


</a>


</div>



</form>



</div>


</div>


</div>


</div>


</div>





<script>

let editId = new URLSearchParams(window.location.search).get("id");


// LOAD FOOD FOR EDIT

async function loadFood(){

if(!editId){
    return;
}


let response = await fetch(

"https://al-fajr-restaurant-production.up.railway.app/orders"

);


let foods = await response.json();


let food = foods.find(item => item._id === editId);


if(food){


document.getElementById("foodName").value = food.name;

document.getElementById("price").value = food.price;

document.getElementById("category").value = food.category;

document.getElementById("image").value = food.image;



document.getElementById("pageTitle").innerHTML =
"✏️ Edit Food Item";


document.getElementById("saveText").innerHTML =
"Update Food";


}


}





// ADD / UPDATE FOOD


document
.getElementById("foodForm")
.addEventListener("submit", async function(e){


e.preventDefault();



const foodData = {


name:
document.getElementById("foodName").value,


price:
Number(document.getElementById("price").value),


category:
document.getElementById("category").value,


image:
document.getElementById("image").value


};



let url =
"https://al-fajr-restaurant-production.up.railway.app/foods"


let method = "POST";



if(editId){


url =
"https://al-fajr-restaurant-production.up.railway.app/foods"+editId;


method = "PUT";


}




try{


let response = await fetch(url,{

method:method,

headers:{

"Content-Type":"application/json"

},

body:JSON.stringify(foodData)

});



await response.json();



alert(
editId ?
"Food Updated Successfully ✅"
:
"Food Added Successfully ✅"
);



window.location.href="admin.html";



}



catch(error){


alert("Something went wrong ❌");


console.log(error);


}



});




loadFood();


</script>



<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>


</body>

</html>
