<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>Admin Login | Al Fajr Restaurant</title>


<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">



<style>


body{

background:#111;

color:white;

font-family:Arial,sans-serif;

height:100vh;

display:flex;

align-items:center;

justify-content:center;

}




.login-box{


background:#1b1b1b;


border:2px solid #ffc107;


border-radius:25px;


padding:40px;


width:400px;


box-shadow:0 15px 40px rgba(255,193,7,0.25);


animation:show 0.5s ease;


}




@keyframes show{


from{

transform:translateY(-30px);

opacity:0;

}


to{

transform:translateY(0);

opacity:1;

}


}






.logo{


width:80px;


height:80px;


border-radius:50%;


margin-bottom:15px;


}





.gold{

color:#ffc107;

}





.form-control{


background:#222;


border:1px solid #555;


color:white;


border-radius:12px;


}



.form-control:focus{


background:#222;


color:white;


border-color:#ffc107;


box-shadow:none;


}





.form-control::placeholder{


color:#aaa;


}







.btn-gold{


background:#ffc107;


color:#000;


font-weight:bold;


border-radius:30px;


padding:12px;


transition:0.3s;


}



.btn-gold:hover{


background:#ffda6a;


transform:scale(1.05);


}




.password-box{

position:relative;

}



.show-btn{


position:absolute;


right:15px;


top:10px;


background:none;


border:none;


color:#ffc107;


}



</style>


</head>



<body>






<div class="login-box text-center">





<img src="images/logo.png"

class="logo">





<h2 class="gold">

🍔 AL FAJR

</h2>



<h5 class="mb-4">

Admin Login

</h5>







<input type="text"

id="username"

class="form-control mb-3"

placeholder="Username">








<div class="password-box">


<input type="password"

id="password"

class="form-control"

placeholder="Password">



<button class="show-btn"

onclick="showPassword()">

👁

</button>


</div>






<button class="btn btn-gold w-100 mt-4"

onclick="login()">


Login 🔐


</button>






<div id="message"

class="mt-3">

</div>





</div>

<script>


// SHOW / HIDE PASSWORD


function showPassword(){


let password = document.getElementById("password");



if(password.type === "password"){


password.type="text";


}

else{


password.type="password";


}


}







// LOGIN FUNCTION


function login(){



let username = document.getElementById("username").value;


let password = document.getElementById("password").value;







if(username==="admin" && password==="12345"){



localStorage.setItem(

"adminLogin",

"true"

);



window.location.href="admin.html";



}



else{



document.getElementById("message").innerHTML=`



<span class="text-danger">

Wrong Username or Password ❌

</span>



`;



}



}



</script>






</body>

</html>
