<h1 class="cart-title">

Your <span class="gold">Cart</span> 🛒

</h1>





<div class="container">


<div id="cartContainer"></div>





<div class="total-box text-center mt-4 mb-5">


<h3>

Total:

<span class="gold" id="cartTotal">

Rs.0

</span>


</h3>




<a href="checkout.html"

class="btn btn-gold mt-3">

Proceed To Checkout 🍔

</a>


</div>


</div>

<script>


// GET CART


let cart = JSON.parse(localStorage.getItem("cart")) || [];





function loadCart(){



let container = document.getElementById("cartContainer");


container.innerHTML="";


let total = 0;





if(cart.length === 0){



container.innerHTML = `


<div class="alert alert-warning text-center p-4">

<h4>

Your Cart Is Empty 🛒

</h4>

<p>

Add your favourite food from Menu

</p>


</div>


`;



document.getElementById("cartTotal").innerHTML="Rs.0";


return;


}







cart.forEach((item,index)=>{



total += item.price * item.quantity;




container.innerHTML += `



<div class="cart-card">


<div class="row align-items-center">





<div class="col-md-2 text-center">


<img src="${item.image}">


</div>






<div class="col-md-4">


<h4>

${item.name}

</h4>


<p class="price">

Rs.${item.price}

</p>


</div>







<div class="col-md-3 text-center">


<button class="qty-btn"

onclick="changeQty(${index},-1)">

-

</button>



<span class="mx-3 fs-5">

${item.quantity}

</span>



<button class="qty-btn"

onclick="changeQty(${index},1)">

+

</button>



</div>







<div class="col-md-3 text-center">


<button class="btn btn-danger"

onclick="removeItem(${index})">

Remove

</button>


</div>





</div>


</div>



`;



});





document.getElementById("cartTotal").innerHTML =

"Rs."+total;



}








// CHANGE QUANTITY


function changeQty(index,value){


cart[index].quantity += value;



if(cart[index].quantity <= 0){


cart.splice(index,1);


}



saveCart();


}







// REMOVE ITEM


function removeItem(index){


cart.splice(index,1);


saveCart();


}







// SAVE CART


function saveCart(){


localStorage.setItem(

"cart",

JSON.stringify(cart)

);



loadCart();



}





loadCart();



</script>
