<h1 class="checkout-title">

Complete Your <span class="gold">Order</span> 🍔

</h1>








<div class="container">


<div class="row">



<!-- CUSTOMER DETAILS -->


<div class="col-md-6 mb-4">


<div class="box">


<h3>

Customer Details 👤

</h3>


<br>



<input type="text"

id="customerName"

class="form-control mb-3"

placeholder="Your Name">





<input type="text"

id="customerPhone"

class="form-control mb-3"

placeholder="Phone Number">





<textarea id="customerAddress"

class="form-control mb-3"

rows="4"

placeholder="Delivery Address"></textarea>



</div>


</div>





<!-- ORDER SUMMARY -->


<div class="col-md-6 mb-4">


<div class="box">


<h3>

Order Summary 🛒

</h3>



<div id="orderSummary"

class="mt-3">

</div>



<h4 class="mt-4">

Total:

<span class="gold" id="checkoutTotal">

Rs.0

</span>

</h4>



<button class="btn btn-gold w-100 mt-3"

onclick="placeOrder()">

Place Order 🍔

</button>



</div>


</div>



</div>


</div>

<script>


// LOAD CART


let cart = JSON.parse(localStorage.getItem("cart")) || [];





function loadSummary(){



let summary = document.getElementById("orderSummary");


summary.innerHTML="";


let total = 0;





if(cart.length === 0){


summary.innerHTML = `

<div class="alert alert-warning">

Your cart is empty 🛒

</div>

`;



}



cart.forEach(item=>{


total += item.price * item.quantity;



summary.innerHTML += `


<div class="summary-item d-flex justify-content-between">


<span>

${item.name} x ${item.quantity}

</span>



<span class="gold">

Rs.${item.price * item.quantity}

</span>


</div>


`;



});





document.getElementById("checkoutTotal").innerHTML =

"Rs."+total;



}








// PLACE ORDER


async function placeOrder(){



let name = document.getElementById("customerName").value;


let phone = document.getElementById("customerPhone").value;


let address = document.getElementById("customerAddress").value;





if(name==="" || phone==="" || address===""){


alert("Please fill all details ❌");


return;


}





let total = cart.reduce(

(sum,item)=>sum + item.price * item.quantity,

0

);






let orderData = {


customerName:name,


customerPhone:phone,


customerAddress:address,


items:cart,


total:total


};








try{



let response = await fetch(

"http://localhost:5000/orders",

{


method:"POST",


headers:{


"Content-Type":"application/json"


},


body:JSON.stringify(orderData)


}


);





let data = await response.json();





document.body.innerHTML += `

<div style="
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.8);
display:flex;
align-items:center;
justify-content:center;
z-index:9999;
">


<div style="
background:#1b1b1b;
border:2px solid #ffc107;
border-radius:20px;
padding:35px;
text-align:center;
color:white;
width:400px;
">


<h2 style="color:#ffc107;">
Order Placed Successfully ✅
</h2>


<p>Your Order ID:</p>


<h4 id="orderIdText">
${data.order._id}
</h4>



<button onclick="
navigator.clipboard.writeText(
document.getElementById('orderIdText').innerText
);
alert('Order ID Copied ✅');
"

style="
background:#ffc107;
border:none;
padding:10px 25px;
border-radius:25px;
font-weight:bold;
">

Copy Order ID 📋

</button>


<br><br>


<button onclick="window.location.href='track-order.html'"

style="
background:white;
border:none;
padding:10px 25px;
border-radius:25px;
font-weight:bold;
">

Track Order 📦

</button>


</div>


</div>

`;









}



catch(error){


console.log(error);


alert("Order Failed ❌");


}




}






loadSummary();



</script>
